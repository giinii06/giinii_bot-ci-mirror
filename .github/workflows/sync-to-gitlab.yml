
name: Sync GitHub to GitLab

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitlab-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Sync branch to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB }}
        run: |
          set -euo pipefail

          if [ -z "${GITLAB_TOKEN:-}" ]; then
            echo "Missing GITLAB secret"
            exit 1
          fi

          cat > "$RUNNER_TEMP/gitlab-askpass" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf 'oauth2\n' ;;
            *Password*) printf '%s\n' "$GITLAB_TOKEN" ;;
          esac
          EOF

          chmod 700 "$RUNNER_TEMP/gitlab-askpass"
          export GIT_ASKPASS="$RUNNER_TEMP/gitlab-askpass"
          export GIT_TERMINAL_PROMPT=0

          REMOTE="https://gitlab.com/blond11qq/giinii_bot.git"

          REMOTE_SHA=$(git ls-remote "$REMOTE" "$GITHUB_REF" | awk '{print $1}')

          if [ "$REMOTE_SHA" = "$GITHUB_SHA" ]; then
            echo "Already synchronized"
            exit 0
          fi

          git push "$REMOTE" "HEAD:$GITHUB_REF"
